building:     [biz_113, biz_114, biz_115, biz_116, biz_117, biz_118]   # vật liệu xây dựng
pharmacy:     [biz_119, biz_120, biz_121, biz_122, biz_123, biz_124]   # nhà thuốc
restaurant:   [biz_125, biz_126, biz_127, biz_128, biz_129, biz_130]   # quán ăn, quán nhậu
