[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamate"
version = "0.2.0"
description = "Zalo AI Challenge 2026 - DataMate offline agent (pipeline_llm: Qwen3-14B + DuckDB)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-calamine>=0.2",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["train", "public_test", "data", "cache", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E402"]
